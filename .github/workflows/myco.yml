name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@80b5729656cb7182c5f09edb0e47850c47761665
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          litellm_api_key: ${{ secrets.LLM_API_KEY }}
          litellm_base_url: ${{ vars.LITELLM_BASE_URL }}
          litellm_model: ${{ vars.LITELLM_MODEL }}
          client_id: ${{ vars.MYCO_CLIENT_ID || 'sandhruv/python-test-file' }}