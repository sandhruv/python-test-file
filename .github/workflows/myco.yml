name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          litellm_api_key: ${{ secrets.LLM_API_KEY }}
          metrics_endpoint: https://liuxmyrceaurpsjiatfk.supabase.co/functions/v1/ingest-metrics
          metrics_api_key: ${{ secrets.MYCO_METRICS_API_KEY }}
          client_id: ${{ vars.MYCO_CLIENT_ID || 'sandhruv/python-test-file' }}